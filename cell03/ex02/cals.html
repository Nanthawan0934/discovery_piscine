<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Card</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div class="calculator-card">
        <h2>Calculator</h2>
        
        <input type="text" id="left-member" placeholder="Left member">
        
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>
        
        <input type="text" id="right-member" placeholder="Right member">
        
        <input type="submit" id="submit-btn" value="Try me!">
    </div>

    <script src="calc.js"></script>
</body>
</html>
